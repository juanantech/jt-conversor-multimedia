# Compila el .exe en Windows, lo prueba y adjunta a la release un ZIP con el .exe y el LÉEME.
name: Compilar
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compilar
        run: .\build.bat
        env:
          PY: python
      - name: Probar
        run: .venv\Scripts\python tests\smoke.py
      - name: Empaquetar
        run: |
          $dir = "paquete\JT Conversor Multimedia"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "dist\JT Conversor Multimedia.exe", "docs\LEEME - Aviso de Windows.txt" $dir
          Compress-Archive $dir JT.Conversor.Multimedia.zip -CompressionLevel NoCompression  # el .exe ya va comprimido
          Get-FileHash "dist\JT Conversor Multimedia.exe", JT.Conversor.Multimedia.zip | Format-List
      - name: Adjuntar a la release
        if: github.event_name == 'release'
        run: gh release upload "$env:TAG" JT.Conversor.Multimedia.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
