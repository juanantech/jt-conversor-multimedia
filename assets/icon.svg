<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- JT Conversor Multimedia · icono con la estética JUANAN TECH -->
  <defs>
    <linearGradient id="blue" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00C2FF"/><stop offset="1" stop-color="#007EEA"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- hexágono: marco azul + interior navy + filos plateados -->
  <polygon points="128,6 233.7,67 233.7,189 128,250 22.3,189 22.3,67" fill="url(#blue)" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="128,24 218.1,76 218.1,180 128,232 37.9,180 37.9,76" fill="url(#navy)" stroke-linejoin="round"/>
  <g class="detail" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="46,146 46,82 104,48" stroke="#CBD5E1" stroke-width="5"/>
    <polyline points="210,110 210,174 152,208" stroke="#CBD5E1" stroke-width="5"/>
    <!-- pistas de circuito -->
    <g stroke="#00C2FF" stroke-width="3" opacity=".9">
      <path d="M72 108H62l-8-8"/><path d="M110 86V70l-8-8"/><path d="M146 86V64"/>
      <path d="M184 112h14l8-8"/><path d="M96 164v20l-8 8"/>
    </g>
    <path d="M72 146H58" stroke="#94A3B8" stroke-width="3"/>
    <g fill="#0F172A" stroke-width="3" filter="url(#glow)">
      <circle cx="51" cy="97" r="5" stroke="#00C2FF"/><circle cx="99" cy="59" r="5" stroke="#00C2FF"/>
      <circle cx="146" cy="59" r="5" stroke="#00C2FF"/><circle cx="209" cy="101" r="5" stroke="#00C2FF"/>
      <circle cx="85" cy="195" r="5" stroke="#00C2FF"/><circle cx="53" cy="146" r="5" stroke="#CBD5E1"/>
    </g>
  </g>
  <!-- pantalla con play (vídeo) -->
  <rect x="68" y="84" width="120" height="84" rx="16" fill="url(#silver)" stroke="#00C2FF" stroke-width="3" filter="url(#glow)"/>
  <path d="M114 105v42l36-21z" fill="url(#blue)" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
  <!-- insignia con nota musical (audio) -->
  <circle cx="180" cy="172" r="28" fill="#0F172A" stroke="url(#blue)" stroke-width="5"/>
  <g fill="#00C2FF" stroke="#00C2FF" stroke-linecap="round" filter="url(#glow)">
    <ellipse cx="172" cy="184" rx="8" ry="6.5" transform="rotate(-20 172 184)" stroke="none"/>
    <path d="M179 182V156q8 2 13 10" fill="none" stroke-width="5"/>
  </g>
</svg>
